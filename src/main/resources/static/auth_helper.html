<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LibraX Auth Redirect</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Authenticating and loading screen...</h2>
  <script>
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role') || 'admin';
      const view = params.get('view') || (role === 'student' ? 'student-dashboard' : 'admin-dashboard');

      const endpoint = role === 'student' ? '/api/auth/student-login' : '/api/auth/login';
      const body = role === 'student' 
        ? { identifier: 'student01', password: 'Student@123' }
        : { username: 'admin', identifier: 'admin', password: 'Admin@123' };

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();
        if (json.success) {
          localStorage.setItem('librax_token', json.data.token);
          const user = {
            id: json.data.userId,
            username: json.data.username,
            email: json.data.email,
            fullName: json.data.fullName,
            role: json.data.role,
            status: 'ACTIVE',
            permissions: json.data.permissions || []
          };
          localStorage.setItem('librax_user', JSON.stringify(user));
          if (json.data.member) {
            localStorage.setItem('librax_member', JSON.stringify(json.data.member));
          }
          window.location.href = '/?view=' + view;
        } else {
          document.body.innerHTML = '<h3>Auth failed: ' + json.message + '</h3>';
        }
      } catch (err) {
        document.body.innerHTML = '<h3>Error: ' + err.message + '</h3>';
      }
    }
    init();
  </script>
</body>
</html>
