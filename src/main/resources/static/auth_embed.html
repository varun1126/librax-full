<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>LibraX View</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #09090b; }
    iframe { border: none; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="loader" style="color: white; font-family: sans-serif; padding: 20px;">Loading screen...</div>
  <script>
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const role = params.get('role') || 'admin';
      const view = params.get('view') || 'admin-dashboard';
      const endpoint = role === 'student' ? '/api/auth/student-login' : '/api/auth/login';
      const body = role === 'student' 
        ? { identifier: 'student01', password: 'Student@123' }
        : { username: 'admin', identifier: 'admin', password: 'Admin@123' };

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const json = await res.json();
      if (json.success) {
        localStorage.setItem('librax_token', json.data.token);
        const user = {
          id: json.data.userId,
          username: json.data.username,
          email: json.data.email,
          fullName: json.data.fullName,
          role: json.data.role,
          status: 'ACTIVE',
          permissions: json.data.permissions || []
        };
        localStorage.setItem('librax_user', JSON.stringify(user));
        if (json.data.member) {
          localStorage.setItem('librax_member', JSON.stringify(json.data.member));
        }

        const iframe = document.createElement('iframe');
        iframe.src = '/?view=' + view;
        document.body.innerHTML = '';
        document.body.appendChild(iframe);
      }
    }
    init();
  </script>
</body>
</html>
