# =====================================================================
# LibraX default configuration
# Override locally via application-local.properties (git-ignored) or
# environment variables where noted. Never commit real secrets here.
# =====================================================================

# --- Server -------------------------------------------------------------
server.port=8085

# --- Library identity -------------------------------------------------
library.name=LibraX University Library

# --- Database -----------------------------------------------------------
# Path is relative to the user's home/data directory unless absolute.
library.database.path=librax-data/librax.db

# --- Loan policy ---------------------------------------------------------
library.loan.periodDays=14
library.loan.maxBooksPerMember=5
library.fine.perDay=5.00
library.fine.blocksIssueWhenUnpaid=true

# --- Google Books API -----------------------------------------------------
# API key is optional for basic public search. If set, prefer the
# LIBRAX_GOOGLE_BOOKS_API_KEY environment variable over this property so
# it is never committed to source control.
api.googleBooks.baseUrl=https://www.googleapis.com/books/v1/volumes
api.googleBooks.apiKey=
api.googleBooks.timeoutSeconds=10
api.googleBooks.maxResults=20

# --- UI -----------------------------------------------------------------
ui.theme=light
ui.pagination.size=25
