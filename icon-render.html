<!DOCTYPE html>
<html>
<head>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent !important;
    overflow: hidden;
    width: 256px;
    height: 256px;
  }
  svg {
    width: 256px;
    height: 256px;
    display: block;
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Badge with subtle gradient and border -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="38" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Left Page -->
  <path d="M13 18C19.5 16 26 17.5 30 20.8V47C26 44 19.5 43 13 45V18Z" fill="#38bdf8" fill-opacity="0.95" filter="url(#glow)"/>
  <!-- Right Page -->
  <path d="M51 18C44.5 16 38 17.5 34 20.8V47C38 44 44.5 43 51 45V18Z" fill="#818cf8" fill-opacity="0.9" filter="url(#glow)"/>
  <!-- Center Spine -->
  <path d="M32 20.2V48" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Intellectual Star -->
  <path d="M32 7.5L33.5 11.2L37.5 12.3L34.3 15L35.4 18.8L32 16.6L28.6 18.8L29.7 15L26.5 12.3L30.5 11.2L32 7.5Z" fill="url(#gold)"/>
</svg>
</body>
</html>
